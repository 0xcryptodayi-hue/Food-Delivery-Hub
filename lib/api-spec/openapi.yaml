openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Ev Yemekleri Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: products
    description: Food product listings
  - name: orders
    description: Order management
  - name: reviews
    description: Reviews and ratings
  - name: cart
    description: Shopping cart
  - name: chat
    description: Messaging
  - name: wallet
    description: Seller wallet
  - name: categories
    description: Food categories
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/{id}/products:
    get:
      operationId: getUserProducts
      tags: [users]
      summary: Get seller's products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seller products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List all products
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: sellerId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product listing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
    put:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /categories:
    get:
      operationId: getCategories
      tags: [categories]
      summary: List food categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Get orders for current user
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [buyer, seller]
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"

  /orders/{id}/status:
    put:
      operationId: updateOrderStatus
      tags: [orders]
      summary: Update order status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Create a review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/seller/{sellerId}:
    get:
      operationId: getSellerReviews
      tags: [reviews]
      summary: Get seller reviews
      parameters:
        - name: sellerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /favorites:
    get:
      operationId: getFavorites
      tags: [users]
      summary: Get user favorites
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: toggleFavorite
      tags: [users]
      summary: Toggle favorite
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: integer
              required: [productId]
      responses:
        "200":
          description: Favorite toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"

  /chat/conversations:
    get:
      operationId: getConversations
      tags: [chat]
      summary: Get all conversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [chat]
      summary: Create or get conversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                otherUserId:
                  type: integer
              required: [otherUserId]
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /chat/conversations/{id}/messages:
    get:
      operationId: getMessages
      tags: [chat]
      summary: Get messages in a conversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [chat]
      summary: Send a message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required: [content]
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get seller wallet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /sellers:
    get:
      operationId: getSellers
      tags: [users]
      summary: Get all sellers
      parameters:
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Sellers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SellerSummary"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [buyer, seller]
      required: [name, email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [buyer, seller, admin]
        avatar:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        isSeller:
          type: boolean
        createdAt:
          type: string
      required: [id, name, email, role, reviewCount, isSeller, createdAt]

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
          nullable: true
        storeImage:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        isSeller:
          type: boolean
        bio:
          type: string
          nullable: true
        totalOrders:
          type: integer
        memberSince:
          type: string
      required: [id, name, reviewCount, isSeller, totalOrders, memberSince]

    SellerSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
          nullable: true
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        address:
          type: string
          nullable: true
        distance:
          type: number
          nullable: true
        productCount:
          type: integer
        isSponsored:
          type: boolean
      required: [id, name, reviewCount, productCount, isSponsored]

    Category:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: string
        color:
          type: string
      required: [id, name, slug, icon, color]

    Product:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
        portion:
          type: string
        dailyStock:
          type: integer
        remainingStock:
          type: integer
        prepTime:
          type: integer
        isAvailable:
          type: boolean
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: string
        sellerAvatar:
          type: string
          nullable: true
        sellerRating:
          type: number
          nullable: true
        isSponsored:
          type: boolean
        isFavorited:
          type: boolean
        createdAt:
          type: string
      required: [id, title, description, price, category, portion, dailyStock, remainingStock, prepTime, isAvailable, reviewCount, sellerId, sellerName, isSponsored, isFavorited, createdAt]

    ProductDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
          nullable: true
        category:
          type: string
        portion:
          type: string
        dailyStock:
          type: integer
        remainingStock:
          type: integer
        prepTime:
          type: integer
        isAvailable:
          type: boolean
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        sellerId:
          type: integer
        sellerName:
          type: string
        sellerAvatar:
          type: string
          nullable: true
        sellerRating:
          type: number
          nullable: true
        sellerAddress:
          type: string
          nullable: true
        isSponsored:
          type: boolean
        isFavorited:
          type: boolean
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        createdAt:
          type: string
      required: [id, title, description, price, category, portion, dailyStock, remainingStock, prepTime, isAvailable, reviewCount, sellerId, sellerName, isSponsored, isFavorited, reviews, createdAt]

    ProductsResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        totalPages:
          type: integer
      required: [products, total, page, totalPages]

    CreateProductRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        category:
          type: string
        portion:
          type: string
        dailyStock:
          type: integer
        prepTime:
          type: integer
      required: [title, description, price, category, portion, dailyStock, prepTime]

    UpdateProductRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        price:
          type: number
        imageUrl:
          type: string
        category:
          type: string
        portion:
          type: string
        dailyStock:
          type: integer
        prepTime:
          type: integer
        isAvailable:
          type: boolean

    OrderItem:
      type: object
      properties:
        productId:
          type: integer
        productTitle:
          type: string
        price:
          type: number
        quantity:
          type: integer
        imageUrl:
          type: string
          nullable: true
      required: [productId, productTitle, price, quantity]

    Order:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
        totalAmount:
          type: number
        deliveryFee:
          type: number
        platformFee:
          type: number
        sellerAmount:
          type: number
        paymentMethod:
          type: string
          enum: [online, cash]
        note:
          type: string
          nullable: true
        deliveryAddress:
          type: string
        estimatedTime:
          type: integer
          nullable: true
        buyerId:
          type: integer
        buyerName:
          type: string
        sellerId:
          type: integer
        sellerName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, status, totalAmount, deliveryFee, platformFee, sellerAmount, paymentMethod, deliveryAddress, buyerId, buyerName, sellerId, sellerName, items, createdAt, updatedAt]

    OrderDetail:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
        totalAmount:
          type: number
        deliveryFee:
          type: number
        platformFee:
          type: number
        sellerAmount:
          type: number
        paymentMethod:
          type: string
          enum: [online, cash]
        note:
          type: string
          nullable: true
        deliveryAddress:
          type: string
        estimatedTime:
          type: integer
          nullable: true
        buyerId:
          type: integer
        buyerName:
          type: string
        buyerPhone:
          type: string
          nullable: true
        sellerId:
          type: integer
        sellerName:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistoryItem"
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, status, totalAmount, deliveryFee, platformFee, sellerAmount, paymentMethod, deliveryAddress, buyerId, buyerName, sellerId, sellerName, items, statusHistory, createdAt, updatedAt]

    StatusHistoryItem:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
        note:
          type: string
          nullable: true
      required: [status, timestamp]

    CreateOrderRequest:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productId:
                type: integer
              quantity:
                type: integer
            required: [productId, quantity]
        deliveryAddress:
          type: string
        paymentMethod:
          type: string
          enum: [online, cash]
        note:
          type: string
        sellerId:
          type: integer
      required: [items, deliveryAddress, paymentMethod, sellerId]

    UpdateOrderStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [received, preparing, ready, on_the_way, delivered, cancelled]
        estimatedTime:
          type: integer
        note:
          type: string
      required: [status]

    Review:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: integer
        comment:
          type: string
          nullable: true
        buyerId:
          type: integer
        buyerName:
          type: string
        buyerAvatar:
          type: string
          nullable: true
        sellerId:
          type: integer
        productId:
          type: integer
          nullable: true
        orderId:
          type: integer
        createdAt:
          type: string
      required: [id, rating, buyerId, buyerName, sellerId, orderId, createdAt]

    CreateReviewRequest:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        sellerId:
          type: integer
        orderId:
          type: integer
        productId:
          type: integer
      required: [rating, sellerId, orderId]

    FavoriteResponse:
      type: object
      properties:
        isFavorited:
          type: boolean
        productId:
          type: integer
      required: [isFavorited, productId]

    Conversation:
      type: object
      properties:
        id:
          type: integer
        otherUser:
          $ref: "#/components/schemas/ConversationUser"
        lastMessage:
          type: string
          nullable: true
        lastMessageAt:
          type: string
          nullable: true
        unreadCount:
          type: integer
      required: [id, otherUser, unreadCount]

    ConversationUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        avatar:
          type: string
          nullable: true
      required: [id, name]

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        content:
          type: string
        isRead:
          type: boolean
        createdAt:
          type: string
      required: [id, conversationId, senderId, content, isRead, createdAt]

    Wallet:
      type: object
      properties:
        totalEarnings:
          type: number
        pendingBalance:
          type: number
        availableBalance:
          type: number
        totalWithdrawn:
          type: number
        platformFeePaid:
          type: number
        recentTransactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
      required: [totalEarnings, pendingBalance, availableBalance, totalWithdrawn, platformFeePaid, recentTransactions]

    WalletTransaction:
      type: object
      properties:
